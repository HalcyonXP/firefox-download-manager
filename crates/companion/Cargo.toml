[package]
name = "download-manager-companion"
description = "Visible Windows companion shell and joined engine ownership (development preview)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
installed = ["dep:download-manager-setup", "dep:download-manager-protocol"]

[[bin]]
name = "download-manager-app"
path = "src/app_main.rs"
required-features = ["installed"]

[dependencies]
download-manager-protocol = { version = "=0.1.0", path = "../protocol", optional = true }
download-manager-native-host = { version = "=0.1.0", path = "../native-host", features = ["local-bridge"] }
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
download-manager-setup = { version = "=0.1.0", path = "../setup", features = ["installed-runtime"], optional = true }
download-manager-local-ipc = { version = "=0.1.0", path = "../local-ipc" }
winsafe.workspace = true

[dev-dependencies]
serde_json.workspace = true
download-manager-engine = { version = "=0.1.0", path = "../engine" }
download-manager-test-server = { version = "=0.1.0", path = "../test-server" }

[lints]
workspace = true
