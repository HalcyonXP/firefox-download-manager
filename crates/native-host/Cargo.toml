[package]
name = "download-manager-native-host"
description = "Firefox Native Messaging host for the Download Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
local-bridge = ["dep:download-manager-local-ipc"]

[dependencies]
download-manager-engine = { version = "=0.1.0", path = "../engine" }
download-manager-protocol = { version = "=0.1.0", path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
download-manager-local-ipc = { version = "=0.1.0", path = "../local-ipc", optional = true }

[dev-dependencies]
download-manager-test-server = { version = "=0.1.0", path = "../test-server" }

[lints]
workspace = true
