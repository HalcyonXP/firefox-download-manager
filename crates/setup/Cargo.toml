[package]
name = "download-manager-setup"
description = "Local current-user installer for Firefox Download Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
private-file = ["dep:winsafe"]
private-directory = ["private-file", "winsafe/advapi", "dep:download-manager-local-ipc"]

[dependencies]
download-manager-protocol = { version = "=0.1.0", path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
download-manager-local-ipc = { version = "=0.1.0", path = "../local-ipc", optional = true }
winreg.workspace = true
winsafe = { workspace = true, optional = true }

[lints]
workspace = true
