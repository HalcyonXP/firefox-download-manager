[workspace]
members = [
    "crates/protocol",
    "crates/engine",
    "crates/native-host",
    "crates/test-server",
    "crates/setup",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false
license = "MIT"

[workspace.dependencies]
bytes = "=1.12.1"
httpdate = "=1.0.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
same-file = "=1.0.6"
sha2 = { version = "=0.11.0", default-features = false }
time = { version = "=0.3.55", default-features = false, features = ["std", "parsing"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.26.0", features = ["v4"] }
winreg = { version = "=0.56.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
