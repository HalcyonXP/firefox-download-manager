name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check extension and protocol
        run: npm run check

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Check JavaScript dependency licenses
        run: npm run licenses:js

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --all-features --locked

      - name: Repeat cancellation regressions
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            cargo test -p download-manager-engine --test scheduler stop --locked
            if ($LASTEXITCODE -ne 0) { throw "Cancellation regression failed" }
          }

      - name: Build Rust
        run: cargo build --workspace --all-features --locked

      - name: Test package allowlist and deterministic archives
        run: python -m unittest discover -s scripts -p "test_build_package.py"

      - name: Build checksummed Windows x64 candidate
        shell: pwsh
        run: ./scripts/build-package.ps1 -TestRust -Rebuild

      - name: Repeat clean-target build and compare bytes
        shell: pwsh
        run: |
          ./scripts/build-package.ps1 -Output artifacts/repeated-package -Rebuild
          python scripts/compare-packages.py artifacts/package artifacts/repeated-package artifacts/reproducibility.json
          if ($LASTEXITCODE) { throw "Repeated candidate bytes differ" }

      - name: Test actual isolated package installation
        run: python scripts/test-package-install.py --package artifacts/package --report artifacts/install-evidence.json

      - name: Upload checksummed candidate and bounded evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-candidate
          path: |
            artifacts/package
            artifacts/install-evidence.json
            artifacts/reproducibility.json
          if-no-files-found: error

      - name: Upload extension build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-dist
          path: extension/dist
          if-no-files-found: error

  windows11-emulation:
    name: Windows 11 x64-emulation package lifecycle
    needs: quality
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Check out lifecycle harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download same checksummed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-candidate
          path: artifacts

      - name: Exercise x64 package on disposable Windows 11 ARM64
        run: python scripts/test-package-install.py --package artifacts/package --report artifacts/windows11-emulation-evidence.json

      - name: Upload bounded emulation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows11-emulation-evidence
          path: artifacts/windows11-emulation-evidence.json
          if-no-files-found: error

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Audit Rust dependencies and licenses
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
