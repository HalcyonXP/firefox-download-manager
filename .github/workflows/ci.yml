name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check extension and protocol
        run: npm run check

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Check JavaScript dependency licenses
        run: npm run licenses:js

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust
        id: rust_tests
        run: cargo test --workspace --all-features --locked

      - name: Repeat cancellation regressions
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            cargo test -p download-manager-engine --test scheduler stop --locked
            if ($LASTEXITCODE -ne 0) { throw "Cancellation regression failed" }
          }

      - name: Build Rust
        run: cargo build --workspace --all-features --locked

      - name: Test package allowlist and deterministic archives
        run: python -m unittest discover -s scripts -p "test_build_package.py"

      - name: Test qualification fixture and reporting boundaries
        run: python -m unittest discover -s scripts -p "test_qualification.py"

      - name: Test setup driver ownership and uncertain dispatch
        run: python -m unittest discover -s scripts -p "test_setup_owner.py"

      - name: Test installed driver boundaries without registration
        run: python -m unittest discover -s scripts -p "test_installed_driver.py"

      - name: Test capture API probe policy without launching Firefox
        run: python -m unittest discover -s scripts -p "test_capture_probe.py"

      - name: Test retained companion browser preflight without launching Firefox
        run: python -m unittest discover -s scripts -p "test_browser_peer.py"

      - name: Test combined browser driver and build-only diagnostic without launching Firefox
        run: python -m unittest discover -s scripts -p "test_browser_installed.py"

      - name: Test explicit handoff recovery without launching Firefox
        run: python -m unittest discover -s scripts -p "test_browser_recovery.py"

      - name: Upload extension build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-dist
          path: extension/dist
          if-no-files-found: error

      - name: Observe isolated script startup after failed Rust gate
        if: ${{ failure() && steps.rust_tests.outcome == 'failure' }}
        shell: pwsh
        run: |
          if (!(Test-Path artifacts -PathType Container)) { New-Item -ItemType Directory artifacts | Out-Null }
          ./scripts/diagnose-private-startup.ps1 -Report artifacts/private-startup-diagnostics.json

      - name: Upload non-qualifying startup observations
        if: ${{ failure() && steps.rust_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-startup-quality-diagnostics
          path: artifacts/private-startup-diagnostics.json
          if-no-files-found: error

  package:
    name: Windows package qualification
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build checksummed Windows x64 candidate
        id: candidate
        shell: pwsh
        run: ./scripts/build-package.ps1 -TestRust -Rebuild

      - name: Observe release-target lifecycle contention (fixed three runs)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem target/package-build/x86_64-pc-windows-gnullvm/release/deps/task_lifecycle-*.exe -File)
          if ($tests.Count -ne 1) { throw "Expected exactly one built lifecycle test executable" }
          $failed = $false
          1..3 | ForEach-Object {
            Write-Output "Lifecycle observation run $_ of 3 (default parallelism)"
            & $tests[0].FullName --nocapture
            if ($LASTEXITCODE) { $failed = $true }
          }
          if ($failed) { throw "At least one release-target lifecycle observation failed" }

      - name: Repeat release-target probe-cancellation regression
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem target/package-build/x86_64-pc-windows-gnullvm/release/deps/task_lifecycle-*.exe -File)
          if ($tests.Count -ne 1) { throw "Expected exactly one built lifecycle test executable" }
          1..10 | ForEach-Object {
            & $tests[0].FullName cancel_interrupts_probe_retry_sleep --exact
            if ($LASTEXITCODE) { throw "Release-target probe cancellation failed" }
          }

      - name: Repeat release-target progress boundary regressions
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem target/package-build/x86_64-pc-windows-gnullvm/release/deps/task_lifecycle-*.exe -File)
          if ($tests.Count -ne 1) { throw "Expected exactly one built lifecycle test executable" }
          1..10 | ForEach-Object {
            & $tests[0].FullName progress_events_ --nocapture
            if ($LASTEXITCODE) { throw "Release-target progress regression failed" }
          }

      - name: Exercise actual candidate native matrix and 2 GiB resource fixture
        run: python scripts/qualification/native.py --package artifacts/package --report artifacts/native-evidence.json

      - name: Repeat clean-target build and compare bytes
        shell: pwsh
        run: |
          ./scripts/build-package.ps1 -Output artifacts/repeated-package -Rebuild
          python scripts/compare-packages.py artifacts/package artifacts/repeated-package artifacts/reproducibility.json
          if ($LASTEXITCODE) { throw "Repeated candidate bytes differ" }

      - name: Test actual isolated package installation
        run: python scripts/test-package-install.py --package artifacts/package --report artifacts/install-evidence.json

      - name: Upload checksummed candidate and bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-candidate
          path: |
            artifacts/package
            artifacts/install-evidence.json
            artifacts/reproducibility.json
            artifacts/native-evidence.json
          if-no-files-found: error

      - name: Observe isolated script startup after failed Rust gate
        if: ${{ failure() && steps.candidate.outcome == 'failure' }}
        shell: pwsh
        run: |
          if (!(Test-Path artifacts -PathType Container)) { New-Item -ItemType Directory artifacts | Out-Null }
          ./scripts/diagnose-private-startup.ps1 -Report artifacts/private-startup-diagnostics.json

      - name: Upload non-qualifying startup observations
        if: ${{ failure() && steps.candidate.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-startup-package-diagnostics
          path: artifacts/private-startup-diagnostics.json
          if-no-files-found: error

  windows11-emulation:
    name: Windows 11 x64-emulation package lifecycle
    needs: [quality, package]
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Check out lifecycle harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download same checksummed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-candidate
          path: artifacts

      - name: Exercise x64 package on disposable Windows 11 ARM64
        run: python scripts/test-package-install.py --package artifacts/package --report artifacts/windows11-emulation-evidence.json

      - name: Upload bounded emulation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows11-emulation-evidence
          path: artifacts/windows11-emulation-evidence.json
          if-no-files-found: error

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Audit Rust dependencies and licenses
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
