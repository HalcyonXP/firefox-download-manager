name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check extension and protocol
        run: npm run check

      - name: Check JavaScript dependency licenses
        run: npm run licenses:js

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --all-features --locked

      - name: Build Rust
        run: cargo build --workspace --all-features --locked

      - name: Test current-user Native Messaging installation
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "Download Manager Native Host With Spaces"
          $profileRoot = Join-Path $env:RUNNER_TEMP "Download Manager Test Profile With Spaces"
          try {
            ./scripts/install-native-host.ps1 `
              -ExecutablePath ./target/debug/download-manager-native-host.exe `
              -InstallRoot $installRoot
            ./scripts/test-native-host-install.ps1 `
              -InstallRoot $installRoot `
              -TestProfileRoot $profileRoot
          }
          finally {
            ./scripts/uninstall-native-host.ps1 -InstallRoot $installRoot
            if (Test-Path -LiteralPath $profileRoot) {
              Remove-Item -LiteralPath $profileRoot -Recurse -Force
            }
          }

      - name: Upload extension build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-dist
          path: extension/dist
          if-no-files-found: error

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Audit Rust dependencies and licenses
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
